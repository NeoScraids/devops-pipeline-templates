name: Reusable Docker Build & Security Scan

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full container image name (e.g. ghcr.io/org/service)"
        required: true
        type: string
      image_tag:
        description: "Target image tag (e.g. commit SHA or semver)"
        required: true
        type: string
      dockerfile:
        description: "Path to the target Dockerfile"
        required: false
        default: "Dockerfile"
        type: string
      context:
        description: "Build context path"
        required: false
        default: "."
        type: string
      fail_on_vulnerabilities:
        description: "Break pipeline if CRITICAL or HIGH vulnerabilities are detected"
        required: false
        default: true
        type: boolean
      build_args:
        description: "Build-time variables passed to Docker as ARG (newline-separated KEY=VALUE pairs)"
        required: false
        default: ""
        type: string
    secrets:
      REGISTRY_USERNAME:
        description: "Container registry authentication username"
        required: false
      REGISTRY_PASSWORD:
        description: "Container registry authentication password or token"
        required: false
      SLACK_WEBHOOK:
        description: "Slack Incoming Webhook URL for failure notifications (optional)"
        required: false

jobs:
  build-scan-push:
    name: Build, Scan & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        if: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Local Image for Security Audit
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: ${{ inputs.fail_on_vulnerabilities && '1' || '0' }}

      - name: Upload Security SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Publish Verified Image to Registry
        if: success() && secrets.REGISTRY_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.image_tag }}
            ${{ inputs.image_name }}:latest

      - name: Notify Slack on Scan Failure
        if: failure() && secrets.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":rotating_light: *Trivy scan failure* on `${{ inputs.image_name }}:${{ inputs.image_tag }}`",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                    { "title": "Workflow", "value": "${{ github.workflow }}", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>", "short": false }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
